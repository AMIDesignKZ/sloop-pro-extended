name: System 37 build and validation

on:
  push:
    branches:
      - extended-firmware
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system37-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python build dependency
        run: python -m pip install --upgrade pip Pillow

      - name: Install JieLi toolchain
        run: sh tools/get_toolchain.sh "$HOME/.jieli"

      - name: Fetch the three pinned JieLi SDK package inputs
        run: |
          SDK="$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools"
          mkdir -p "$SDK/cfg"
          BASE="https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK/raw/d179b4484759423312073f5fbb232501aa491047/cpu/wl82/tools"
          curl -fL --retry 3 "$BASE/uboot.boot" -o "$SDK/uboot.boot"
          curl -fL --retry 3 "$BASE/cfg_tool.bin" -o "$SDK/cfg_tool.bin"
          curl -fL --retry 3 "$BASE/cfg/eq_cfg_hw.bin" -o "$SDK/cfg/eq_cfg_hw.bin"

      - name: Build System 37 SMK-37 Pro only
        run: |
          BOARD=smk37 MODEL=pro sh build.sh
          python3 tests/smk_pkg_test.py build/system37.fwsc "SMK-37 Pro_900"
          # The host suite expects a package at this legacy path; keep its target
          # disassembly and budget checks tied to the Pro build produced above.
          cp build/system37.fwsc build/felucca.fwsc

      - name: Run host, sanitizer, target-budget and web test suite
        env:
          EDFZ_N: "2000"
        run: sh tests/run_tests.sh

      - name: Publish firmware packages and installer site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system37-build-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/release/system37.fwsc
            build/release/system37-elite.fwsc
            build/release/system37-mke.fwsc
            build/release/SHA256SUMS.txt
            build/system37-site/
            build/felucca.fwsc
