name: System 37 build and validation

on:
  push:
    branches:
      - extended-firmware
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system37-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python build dependency
        run: python -m pip install --upgrade pip Pillow

      - name: Install JieLi toolchain
        run: sh tools/get_toolchain.sh "$HOME/.jieli"

      - name: Fetch only the three pinned JieLi SDK package inputs
        run: |
          SDK="$HOME/fw-AC79_AIoT_SDK"
          git clone --filter=blob:none --no-checkout --depth 1 \
            --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$SDK"
          git -C "$SDK" sparse-checkout init --no-cone
          git -C "$SDK" sparse-checkout set --no-cone \
            /cpu/wl82/tools/uboot.boot \
            /cpu/wl82/tools/cfg_tool.bin \
            /cpu/wl82/tools/cfg/eq_cfg_hw.bin
          git -C "$SDK" checkout

      - name: Build System 37 SMK-37 Pro only
        run: |
          BOARD=smk37 MODEL=pro sh build.sh
          python3 tests/smk_pkg_test.py build/system37.fwsc "SMK-37 Pro_900"
          # The host suite expects a package at this legacy path; keep its target
          # disassembly and budget checks tied to the Pro build produced above.
          cp build/system37.fwsc build/felucca.fwsc

      - name: Run host, sanitizer, target-budget and web test suite
        env:
          EDFZ_N: "2000"
        run: sh tests/run_tests.sh

      - name: Publish firmware packages and installer site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system37-build-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/release/system37.fwsc
            build/release/system37-elite.fwsc
            build/release/system37-mke.fwsc
            build/release/SHA256SUMS.txt
            build/system37-site/
            build/felucca.fwsc
